<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sign In | Ricmuk Enterprises</title>
<meta name="description" content="Sign in to your Ricmuk Enterprises account to see your orders.">
<meta name="theme-color" content="#14257a">
<meta property="og:title" content="Sign In | Ricmuk Enterprises"><meta property="og:description" content="Sign in to your Ricmuk Enterprises account to see your orders."><meta property="og:type" content="website"><meta property="og:image" content="img/shopfront.jpg">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<script src="assets/theme.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=Barlow:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/style.css">
</head>
<body data-nav="">
<div id="hdr"></div>
<main id="main">
<div class="auth-wrap"><div class="card auth-card"><h1>Sign in</h1>
<form id="lf" novalidate>
 <div class="fg"><label class="f" for="lEmail">Email</label><input id="lEmail" type="email" autocomplete="email" required></div>
 <div class="fg"><label class="f" for="lPw">Password</label><div class="pw"><input id="lPw" type="password" autocomplete="current-password" required><button type="button"></button></div></div>
 <button class="btn btn-red btn-block" type="submit">Sign in</button><p class="msg" id="lMsg" role="alert"></p></form>
<p class="muted small" style="margin-top:14px">New here? <a href="signup.html" style="font-weight:700">Create an account</a>. You can also order without one.</p></div></div>
</main>
<div id="ftr"></div>
<script src="assets/app.js"></script>
<script>
App.ready.then(function(){App.pwToggles();if(App.user)location.replace('account.html');});
document.getElementById('lf').addEventListener('submit',function(e){
  e.preventDefault();var m=document.getElementById('lMsg');m.className='msg';m.textContent='';
  App.api('/api/login',{body:{email:lEmail.value,password:lPw.value}}).then(function(d){
    if(d.success){var n=new URLSearchParams(location.search).get('next');location.href=(n&&/^[a-z0-9_-]+\.html$/i.test(n))?n:(d.user.role==='admin'?'dashboard.html':'account.html');}
    else{m.className='msg err';m.textContent=d.message;}
  });
});
</script>
</body>
</html>
