<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Track Your Order | Ricmuk Enterprises</title>
<meta name="description" content="Track your Ricmuk Enterprises order using your order number and phone number.">
<meta name="theme-color" content="#14257a">
<meta property="og:title" content="Track Your Order | Ricmuk Enterprises"><meta property="og:description" content="Track your Ricmuk Enterprises order using your order number and phone number."><meta property="og:type" content="website"><meta property="og:image" content="img/shopfront.jpg">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<script src="assets/theme.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=Barlow:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/style.css">
</head>
<body data-nav="track">
<div id="hdr"></div>
<main id="main">
<header class="page-head"><div class="container"><span class="kicker">Order tracking</span><h1>Track your order</h1><p>Enter the order number from your slip and the phone number you ordered with.</p></div></header>
<section class="section" style="padding-top:34px"><div class="container" style="max-width:560px">
  <form class="card" id="tf" novalidate>
    <div class="fg"><label class="f" for="tNo">Order number</label><input id="tNo" placeholder="RIC-260101-1234" autocomplete="off" required></div>
    <div class="fg"><label class="f" for="tPh">Phone number used for the order</label><input id="tPh" type="tel" placeholder="077 123 4567" required></div>
    <button class="btn btn-red btn-block" type="submit">Track order</button><p class="msg" id="tMsg" role="alert"></p>
    <p class="muted small" style="margin-top:12px">Signed-in customers can also see all their orders in <a href="account.html" style="font-weight:700">My account</a>.</p>
  </form></div></section>
</main>
<div id="ftr"></div>
<script src="assets/app.js"></script>
<script>
App.ready.then(function(){var u=new URLSearchParams(location.search);if(u.get('no'))document.getElementById('tNo').value=u.get('no');});
document.getElementById('tf').addEventListener('submit',function(e){
  e.preventDefault();var no=document.getElementById('tNo').value.trim(),ph=document.getElementById('tPh').value.trim(),m=document.getElementById('tMsg');m.className='msg';m.textContent='';
  if(!no||!ph){m.className='msg err';m.textContent='Please enter both the order number and phone number.';return;}
  App.api('/api/orders/track?no='+encodeURIComponent(no)+'&phone='+encodeURIComponent(ph)).then(function(d){
    if(d.success)location.href='order.html?no='+encodeURIComponent(d.order.order_no)+'&phone='+encodeURIComponent(ph);else{m.className='msg err';m.textContent=d.message;}
  });
});
</script>
</body>
</html>
