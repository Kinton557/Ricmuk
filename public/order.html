<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Order Slip | Ricmuk Enterprises</title>
<meta name="description" content="Your Ricmuk Enterprises order slip and status.">
<meta name="theme-color" content="#14257a">
<meta property="og:title" content="Order Slip | Ricmuk Enterprises"><meta property="og:description" content="Your Ricmuk Enterprises order slip and status."><meta property="og:type" content="website"><meta property="og:image" content="img/shopfront.jpg">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<script src="assets/theme.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=Barlow:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/style.css">
</head>
<body data-nav="track" data-no-track>
<div id="hdr"></div>
<main id="main">

<section class="section" style="padding-top:34px"><div class="container">
  <div id="state" class="empty">Loading your order...</div>
  <div id="wrap" hidden>
    <div class="card no-print" id="okBanner" style="max-width:820px;margin:0 auto 20px;border-color:var(--ok)" hidden><h3 style="color:var(--ok)">Thank you, your order is in!</h3><p class="muted">We will call you shortly to confirm stock, your final total and when your order will be ready. Keep your order number to track it.</p></div>
    <div class="card no-print" style="max-width:820px;margin:0 auto 20px"><div style="display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;align-items:center"><div><span class="muted small">Status</span><br><span class="status-pill" id="stPill"></span> <span class="status-pill" id="payPill"></span></div><div style="display:flex;gap:8px;flex-wrap:wrap"><button type="button" class="btn btn-navy btn-sm" onclick="window.print()">Print / Save PDF</button><a class="btn btn-wa btn-sm" id="waSend" target="_blank" rel="noopener" href="#">Send to Ricmuk on WhatsApp</a></div></div><ol class="steps" id="steps"></ol></div>
    <div class="slip" id="slip"></div>
  </div>
</div></section>
</main>
<div id="ftr"></div>
<script src="assets/app.js"></script>
<script>
var STEPS=[['pending','Received'],['confirmed','Confirmed'],['ready','Ready'],['completed','Done']];
App.ready.then(function(){
  var u=new URLSearchParams(location.search),no=u.get('no')||'',ph=u.get('phone')||'';
  if(!no){document.getElementById('state').innerHTML='No order number given. <a href="track.html" style="font-weight:700">Track an order</a>';return;}
  App.api('/api/orders/track?no='+encodeURIComponent(no)+'&phone='+encodeURIComponent(ph)).then(function(d){
    if(!d.success){document.getElementById('state').innerHTML=App.esc(d.message)+' <a href="track.html" style="font-weight:700">Try again</a>';return;}
    show(d.order,u.get('new')==='1');
  });
});
function show(o,isNew){
  var c=App.cfg;document.title='Order '+o.order_no+' | Ricmuk Enterprises';
  document.getElementById('state').hidden=true;document.getElementById('wrap').hidden=false;document.getElementById('okBanner').hidden=!isNew;
  var sp=document.getElementById('stPill');sp.textContent=App.statusLabel(o.status);sp.className='status-pill '+o.status;
  var pp=document.getElementById('payPill');pp.textContent=o.payment_status==='paid'?'Paid':'Unpaid';pp.className='status-pill '+o.payment_status;
  var order=['pending','confirmed','ready','completed'],cur=o.status==='out_for_delivery'?2:order.indexOf(o.status);
  document.getElementById('steps').innerHTML=o.status==='cancelled'?'<li style="grid-column:1/-1;padding-top:0;color:var(--bad)">This order was cancelled.</li>':STEPS.map(function(s,i){var lbl=s[1];if(i===2&&o.method==='delivery')lbl=o.status==='out_for_delivery'?'On the way':'Ready';return '<li class="'+(i<=cur?'done':'')+'">'+lbl+'</li>';}).join('');
  var rows=o.items.map(function(l){return '<tr><td>'+App.esc(l.name)+'<br><small>'+App.esc(l.unit)+'</small></td><td class="r">'+l.qty+'</td><td class="r">'+App.money(l.price)+'</td><td class="r">'+App.money(l.line)+'</td></tr>';}).join('');
  var z=App.zwg(o.total);
  document.getElementById('slip').innerHTML=
   '<div class="slip-top"><div><img src="img/logo.png" alt="Ricmuk Enterprises"><p style="margin-top:8px;font-size:.88rem">'+App.esc(c.address)+'<br>'+App.esc(c.area)+'<br>'+App.esc(c.phone1)+' / '+App.esc(c.phone2)+'</p></div><div style="text-align:right"><h2>Order slip</h2><p><b>'+App.esc(o.order_no)+'</b><br><small>'+App.esc(App.fmtDate(o.created_at))+'</small></p></div></div>'+
   '<div class="grid2"><div><b>Customer</b>'+App.esc(o.name)+'<br>'+App.esc(o.phone)+(o.email?'<br>'+App.esc(o.email):'')+'</div><div><b>'+(o.method==='delivery'?'Delivery to':'Collect from')+'</b>'+(o.method==='delivery'?App.esc(o.address):App.esc(c.address)+'<br>'+App.esc(c.area))+'</div>'+
   '<div><b>Payment</b>'+(o.payment_method==='ecocash'?'EcoCash'+(o.payment_ref?' (ref '+App.esc(o.payment_ref)+')':''):'At the shop / on delivery')+' &middot; '+(o.payment_status==='paid'?'Paid':'Unpaid')+'</div><div><b>Status</b>'+App.esc(App.statusLabel(o.status))+'</div></div>'+
   '<table><thead><tr><th>Item</th><th class="r">Qty</th><th class="r">Price</th><th class="r">Total</th></tr></thead><tbody>'+rows+'</tbody></table>'+
   '<div class="tot"><span>Subtotal</span><span>'+App.money(o.subtotal)+'</span></div>'+
   '<div class="tot"><span>Delivery</span><span>'+(o.method==='delivery'?(o.delivery_fee>0?App.money(o.delivery_fee):'To be confirmed'):'Collect')+'</span></div>'+
   '<div class="tot big"><span>Total</span><span>'+App.money(o.total)+'</span></div>'+(z?'<p class="muted small" style="text-align:right">\u2248 '+App.esc(z)+'</p>':'')+
   (o.note?'<p style="margin-top:14px"><b>Your note:</b> '+App.esc(o.note)+'</p>':'')+(o.staff_note?'<p style="margin-top:10px"><b>Message from Ricmuk:</b> '+App.esc(o.staff_note)+'</p>':'')+
   '<p class="muted small" style="margin-top:18px;border-top:1px dashed #bbb;padding-top:12px">'+App.esc(c.price_notice||'')+' This slip is not a tax invoice. Thank you for shopping at '+App.esc(c.shop_name)+'.</p>';
  var t='Hello Ricmuk, my order number is '+o.order_no+' (total '+App.money(o.total)+'). Name: '+o.name+'.';
  document.getElementById('waSend').href=App.waLink(t);
}
</script>
</body>
</html>
