<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>My Account | Ricmuk Enterprises</title>
<meta name="description" content="Your Ricmuk Enterprises account and order history.">
<meta name="theme-color" content="#14257a">
<meta property="og:title" content="My Account | Ricmuk Enterprises"><meta property="og:description" content="Your Ricmuk Enterprises account and order history."><meta property="og:type" content="website"><meta property="og:image" content="img/shopfront.jpg">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<script src="assets/theme.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=Barlow:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/style.css">
</head>
<body data-nav="" data-no-track>
<div id="hdr"></div>
<main id="main">
<header class="page-head"><div class="container"><span class="kicker">My account</span><h1>Your orders</h1></div></header>
<section class="section" style="padding-top:30px"><div class="container">
  <div class="card" style="margin-bottom:22px;display:flex;justify-content:space-between;gap:14px;flex-wrap:wrap;align-items:center"><div><b id="aName" style="font-size:1.2rem"></b><br><span class="muted" id="aMail"></span></div><div style="display:flex;gap:10px;flex-wrap:wrap"><a class="btn btn-red btn-sm" href="shop.html">Keep shopping</a><a class="btn btn-navy btn-sm" id="aDash" href="dashboard.html" hidden>Admin dashboard</a><button class="btn btn-line btn-sm" id="aOut" type="button">Sign out</button></div></div>
  <div id="oList"><p class="muted">Loading your orders...</p></div>

  <div class="row2" style="margin-top:26px;align-items:start">
    <form class="card" id="pf" novalidate><h3>My details</h3>
      <div class="fg"><label class="f" for="pName">Full name</label><input id="pName" autocomplete="name"></div>
      <div class="fg"><label class="f" for="pPhone">Phone</label><input id="pPhone" type="tel" autocomplete="tel"></div>
      <button class="btn btn-navy btn-sm" type="submit">Save details</button><p class="msg" id="pMsg" role="alert"></p></form>
    <form class="card" id="wf" novalidate><h3>Change password</h3>
      <div class="fg"><label class="f" for="wCur">Current password</label><div class="pw"><input id="wCur" type="password" autocomplete="current-password"><button type="button"></button></div></div>
      <div class="fg"><label class="f" for="wNew">New password (8+ characters)</label><div class="pw"><input id="wNew" type="password" autocomplete="new-password"><button type="button"></button></div></div>
      <button class="btn btn-navy btn-sm" type="submit">Update password</button><p class="msg" id="wMsg" role="alert"></p></form>
  </div>
</div></section>
</main>
<div id="ftr"></div>
<script src="assets/app.js"></script>
<script>
App.ready.then(function(){
  if(!App.user){location.replace('login.html?next=account.html');return;}
  aName.textContent=App.user.name;aMail.textContent=App.user.email;if(App.user.role==='admin')aDash.hidden=false;aOut.onclick=App.logout;pName.value=App.user.name||'';pPhone.value=App.user.phone||'';App.pwToggles();load();
});
function load(){
  App.api('/api/my/orders').then(function(d){
    var box=document.getElementById('oList');
    if(!d.success||!d.orders.length){box.innerHTML='<div class="empty"><p style="font-weight:700;color:var(--text)">No orders yet</p><p style="margin:8px 0 16px">Orders you place while signed in show up here.</p><a class="btn btn-red btn-sm" href="shop.html">Start shopping</a></div>';return;}
    box.innerHTML='<div class="table-wrap"><table class="t"><thead><tr><th>Order</th><th>Date</th><th>Items</th><th>Total</th><th>Status</th><th></th></tr></thead><tbody>'+d.orders.map(function(o){
      return '<tr><td><b>'+App.esc(o.order_no)+'</b></td><td>'+App.esc(App.fmtDate(o.created_at))+'</td><td>'+o.items.reduce(function(a,l){return a+l.qty;},0)+'</td><td>'+App.money(o.total)+'</td><td><span class="status-pill '+o.status+'">'+App.esc(App.statusLabel(o.status))+'</span></td><td style="white-space:nowrap"><a class="btn btn-navy btn-sm" href="order.html?no='+encodeURIComponent(o.order_no)+'&phone='+encodeURIComponent(o.phone)+'">View slip</a>'+(o.status==='pending'?' <button class="btn btn-line btn-sm" data-cancel="'+App.esc(o.order_no)+'">Cancel</button>':'')+'</td></tr>';
    }).join('')+'</tbody></table></div>';
  });
}
pf.addEventListener('submit',function(e){e.preventDefault();App.api('/api/account/profile',{body:{name:pName.value,phone:pPhone.value}}).then(function(d){pMsg.className='msg '+(d.success?'good':'err');pMsg.textContent=d.success?'Saved.':d.message;});});
wf.addEventListener('submit',function(e){e.preventDefault();App.api('/api/account/password',{body:{current:wCur.value,password:wNew.value}}).then(function(d){wMsg.className='msg '+(d.success?'good':'err');wMsg.textContent=d.success?'Password updated.':d.message;if(d.success)wf.reset();});});
document.addEventListener('click',function(e){var b=e.target.closest('[data-cancel]');if(!b)return;if(!confirm('Cancel order '+b.dataset.cancel+'?'))return;
  App.api('/api/my/orders/cancel',{body:{order_no:b.dataset.cancel}}).then(function(d){App.toast(d.success?'Order cancelled':d.message);load();});});
</script>
</body>
</html>
