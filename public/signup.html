<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Create Account | Ricmuk Enterprises</title>
<meta name="description" content="Create a Ricmuk Enterprises account to save your details and see your order history.">
<meta name="theme-color" content="#14257a">
<meta property="og:title" content="Create Account | Ricmuk Enterprises"><meta property="og:description" content="Create a Ricmuk Enterprises account to save your details and see your order history."><meta property="og:type" content="website"><meta property="og:image" content="img/shopfront.jpg">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<script src="assets/theme.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=Barlow:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/style.css">
</head>
<body data-nav="">
<div id="hdr"></div>
<main id="main">
<div class="auth-wrap"><div class="card auth-card"><h1>Create account</h1>
<form id="sf" novalidate>
 <div class="fg"><label class="f" for="sName">Full name</label><input id="sName" autocomplete="name" required></div>
 <div class="row2"><div class="fg"><label class="f" for="sEmail">Email</label><input id="sEmail" type="email" autocomplete="email" required></div><div class="fg"><label class="f" for="sPhone">Phone</label><input id="sPhone" type="tel" autocomplete="tel"></div></div>
 <div class="fg"><label class="f" for="sPw">Password (8+ characters)</label><div class="pw"><input id="sPw" type="password" autocomplete="new-password" required><button type="button"></button></div></div>
 <label style="display:flex;gap:10px;align-items:flex-start;font-size:.9rem;margin-bottom:14px"><input type="checkbox" id="sAgree" style="margin-top:5px"><span>I agree to the <a href="terms.html" target="_blank" style="font-weight:700">Terms</a> and <a href="privacy.html" target="_blank" style="font-weight:700">Privacy Policy</a>.</span></label>
 <button class="btn btn-red btn-block" type="submit">Create account</button><p class="msg" id="sMsg" role="alert"></p></form>
<p class="muted small" style="margin-top:14px">Already have an account? <a href="login.html" style="font-weight:700">Sign in</a></p></div></div>
</main>
<div id="ftr"></div>
<script src="assets/app.js"></script>
<script>
App.ready.then(function(){App.pwToggles();});
document.getElementById('sf').addEventListener('submit',function(e){
  e.preventDefault();var m=document.getElementById('sMsg');m.className='msg';m.textContent='';
  if(!sAgree.checked){m.className='msg err';m.textContent='Please tick the box to agree to the Terms and Privacy Policy.';return;}
  App.api('/api/signup',{body:{name:sName.value,email:sEmail.value,phone:sPhone.value,password:sPw.value}}).then(function(d){
    if(d.success)location.href='account.html';else{m.className='msg err';m.textContent=d.message;}
  });
});
</script>
</body>
</html>
